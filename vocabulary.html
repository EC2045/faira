<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faarai — 単語集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/85e1194b.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="faarai-intro.html">Faarai</a>
  <a class="nav-back" href="faarai-intro.html">← 紹介サイトへ</a>
</nav>

<div class="page">
  <!-- ─── SIDEBAR ─── -->
  <aside>
    <div class="sidebar-title">CATEGORIES</div>
    <a class="cat-link active" data-cat="all" onclick="filterCat('all',this)">
      <span class="cat-dot" style="background:var(--accent)"></span>
      すべて
      <span class="cat-count" id="cnt-all"></span>
    </a>
    <a class="cat-link" data-cat="greeting" onclick="filterCat('greeting',this)">
      <span class="cat-dot" style="background:#7ee3b0"></span>
      挨拶・表現
      <span class="cat-count" id="cnt-greeting"></span>
    </a>
    <a class="cat-link" data-cat="noun" onclick="filterCat('noun',this)">
      <span class="cat-dot" style="background:#7ec8e3"></span>
      基本名詞
      <span class="cat-count" id="cnt-noun"></span>
    </a>
    <a class="cat-link" data-cat="verb" onclick="filterCat('verb',this)">
      <span class="cat-dot" style="background:#b87ee3"></span>
      動詞
      <span class="cat-count" id="cnt-verb"></span>
    </a>
    <a class="cat-link" data-cat="adj" onclick="filterCat('adj',this)">
      <span class="cat-dot" style="background:#e3b87e"></span>
      形容詞
      <span class="cat-count" id="cnt-adj"></span>
    </a>
    <a class="cat-link" data-cat="color" onclick="filterCat('color',this)">
      <span class="cat-dot" style="background:#e37e7e"></span>
      色
      <span class="cat-count" id="cnt-color"></span>
    </a>
    <a class="cat-link" data-cat="food" onclick="filterCat('food',this)">
      <span class="cat-dot" style="background:#e3c87e"></span>
      食べ物
      <span class="cat-count" id="cnt-food"></span>
    </a>
    <a class="cat-link" data-cat="creature" onclick="filterCat('creature',this)">
      <span class="cat-dot" style="background:#a8e37e"></span>
      生物
      <span class="cat-count" id="cnt-creature"></span>
    </a>
    <a class="cat-link" data-cat="it" onclick="filterCat('it',this)">
      <span class="cat-dot" style="background:#e37ea8"></span>
      IT用語
      <span class="cat-count" id="cnt-it"></span>
    </a>
    <a class="cat-link" data-cat="science" onclick="filterCat('science',this)">
      <span class="cat-dot" style="background:#7ea8e3"></span>
      科学
      <span class="cat-count" id="cnt-science"></span>
    </a>
    <a class="cat-link" data-cat="number" onclick="filterCat('number',this)">
      <span class="cat-dot" style="background:#7ee3c8"></span>
      数字
      <span class="cat-count" id="cnt-number"></span>
    </a>
  </aside>

  <!-- ─── MAIN ─── -->
  <main>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="単語・意味で検索…" oninput="doSearch()">
      <span class="search-count" id="search-count"></span>
    </div>

    <div class="filter-row" id="chip-row"></div>

    <div id="word-list"></div>
    <div class="empty" id="empty-state">
      <div class="empty-icon">Ø</div>
      <p>該当する単語が見つかりません</p>
    </div>
  </main>
</div>

<!-- ─── MODAL ─── -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-pos" id="m-pos"></div>
    <div class="modal-word" id="m-word"></div>
    <div class="modal-pron" id="m-pron"></div>
    <div class="modal-meaning" id="m-meaning"></div>
    <div class="modal-faarao-label">FAARAO SCRIPT</div>
    <div class="modal-faarao-render" id="m-faarao"></div>
  </div>
</div>

<script src="https://ec2045.github.io/Faairao/index.js"></script>
  <script src="src/6c999364.js"></script>
</body>
</html>
