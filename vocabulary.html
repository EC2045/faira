<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faarai — 単語集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: '2045alphabet';
  src: url('https://ec2045.github.io/2045font/2045alphabet.otf') format('opentype');
}

:root {
  --bg:      #ffffff;
  --bg2:     #f5f5f7;
  --bg3:     #e8e8ea;
  --bg4:     #dcdce0;
  --accent:  #5a9ab0;
  --accent2: #c68a45;
  --accent3: #955ab0;
  --green:   #4aab7a;
  --red:     #c95858;
  --text:    #1a1a20;
  --muted:   #666677;
  --border:  rgba(90, 154, 176, 0.2);
  --serif:   '2045alphabet','Noto Sans JP',sans-serif;
  --body:    'Noto Sans JP',sans-serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-weight: 300;
  min-height: 100svh;
}

/* ─── NAV ─── */
nav {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(9,9,14,0.88);
  backdrop-filter: blur(16px);
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 1.5rem;
  height: 52px;
}
.nav-logo {
  font-family: var(--serif);
  font-size: 1.25rem;
  color: var(--accent);
  margin-right: auto;
  letter-spacing: 0.05em;
  text-decoration: none;
}
.nav-back {
  font-family: var(--serif);
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
  padding: 0.4rem 0.8rem;
  border: 0.5px solid var(--border);
  border-radius: 6px;
}
.nav-back:hover { color: var(--accent); border-color: rgba(126,200,227,0.35); }

/* ─── LAYOUT ─── */
.page {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100svh - 52px);
}

/* ─── SIDEBAR ─── */
aside {
  position: sticky;
  top: 52px;
  height: calc(100svh - 52px);
  overflow-y: auto;
  border-right: 0.5px solid var(--border);
  padding: 1.5rem 1rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.sidebar-title {
  font-family: var(--serif);
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  color: var(--accent);
  margin-bottom: 1rem;
  padding-left: 0.4rem;
}
.cat-link {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.42rem 0.6rem;
  border-radius: 7px;
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--muted);
  transition: all 0.15s;
  text-decoration: none;
  margin-bottom: 2px;
  border: 0.5px solid transparent;
}
.cat-link:hover, .cat-link.active {
  color: var(--text);
  background: var(--bg3);
  border-color: var(--border);
}
.cat-link.active { color: var(--accent); }
.cat-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cat-count {
  margin-left: auto;
  font-size: 0.65rem;
  color: var(--muted);
  font-family: var(--serif);
}

/* ─── MAIN ─── */
main {
  padding: 2rem 2.5rem 4rem;
  max-width: 900px;
}

/* ─── SEARCH BAR ─── */
.search-wrap {
  position: relative;
  margin-bottom: 2rem;
}
.search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 0.85rem;
  pointer-events: none;
}
#search {
  width: 100%;
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 0.75rem 1rem 0.75rem 2.5rem;
  font-family: var(--body);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}
#search:focus { border-color: rgba(126,200,227,0.45); }
#search::placeholder { color: var(--muted); }
.search-count {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.7rem;
  font-family: var(--serif);
  color: var(--muted);
  letter-spacing: 0.1em;
}

/* ─── FILTER CHIPS ─── */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 2rem;
}
.chip {
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-family: var(--serif);
  letter-spacing: 0.1em;
  border: 0.5px solid var(--border);
  cursor: pointer;
  color: var(--muted);
  background: transparent;
  transition: all 0.15s;
}
.chip:hover { color: var(--text); border-color: rgba(126,200,227,0.35); }
.chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

/* ─── SECTION HEADER ─── */
.sec-head {
  display: flex;
  align-items: baseline;
  gap: 0.8rem;
  margin: 2.5rem 0 1rem;
  padding-bottom: 0.6rem;
  border-bottom: 0.5px solid var(--border);
}
.sec-head:first-of-type { margin-top: 0; }
.sec-title {
  font-family: var(--serif);
  font-size: 0.65rem;
  letter-spacing: 0.35em;
  color: var(--accent);
}
.sec-count {
  font-size: 0.7rem;
  color: var(--muted);
  font-family: var(--serif);
}

/* ─── WORD GRID ─── */
.word-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 0.7rem;
}

/* ─── WORD CARD ─── */
.word-card {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.word-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--card-accent, var(--accent));
  opacity: 0;
  transition: opacity 0.2s;
}
.word-card:hover {
  border-color: rgba(126,200,227,0.3);
  background: var(--bg3);
  transform: translateY(-2px);
}
.word-card:hover::before { opacity: 1; }

.wc-pos {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  font-family: var(--serif);
  margin-bottom: 0.3rem;
}
.wc-faarai {
  font-family: var(--serif);
  font-size: 1.05rem;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 0.3rem;
  word-break: break-all;
}
.wc-meaning {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.45;
}
.wc-pron {
  font-size: 0.7rem;
  color: var(--accent2);
  margin-top: 0.25rem;
  font-style: italic;
}

/* ─── MODAL ─── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-bg.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: var(--bg2);
  border: 0.5px solid rgba(126,200,227,0.3);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 420px;
  position: relative;
  transform: translateY(16px);
  transition: transform 0.25s;
}
.modal-bg.open .modal { transform: none; }

.modal-close {
  position: absolute;
  top: 1rem; right: 1rem;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  width: 28px; height: 28px;
  cursor: pointer;
  font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.modal-close:hover { color: var(--text); }

.modal-pos {
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  font-family: var(--serif);
  margin-bottom: 0.6rem;
}
.modal-word {
  font-family: var(--serif);
  font-size: 2.5rem;
  color: var(--text);
  line-height: 1;
  margin-bottom: 0.5rem;
}
.modal-pron {
  font-size: 0.85rem;
  color: var(--accent2);
  font-style: italic;
  margin-bottom: 1rem;
}
.modal-meaning {
  font-size: 1rem;
  color: var(--text);
  padding: 0.8rem 1rem;
  background: var(--bg3);
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 2px solid var(--accent);
}
.modal-faarao-render {
  min-height: 80px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 0.5rem;
}
.modal-faarao-label {
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  font-family: var(--serif);
  color: var(--muted);
  margin-bottom: 0.4rem;
}

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--muted);
  display: none;
}
.empty-icon { font-family: var(--serif); font-size: 2.5rem; margin-bottom: 0.8rem; }
.empty p { font-size: 0.85rem; }

/* ─── COLOR MAP ─── */
.cat-noun     { --card-accent: #7ec8e3; color: #7ec8e3; }
.cat-verb     { --card-accent: #b87ee3; color: #b87ee3; }
.cat-adj      { --card-accent: #e3b87e; color: #e3b87e; }
.cat-greeting { --card-accent: #7ee3b0; color: #7ee3b0; }
.cat-science  { --card-accent: #7ea8e3; color: #7ea8e3; }
.cat-it       { --card-accent: #e37ea8; color: #e37ea8; }
.cat-food     { --card-accent: #e3c87e; color: #e3c87e; }
.cat-creature { --card-accent: #a8e37e; color: #a8e37e; }
.cat-number   { --card-accent: #7ee3c8; color: #7ee3c8; }
.cat-color    { --card-accent: #e37e7e; color: #e37e7e; }

/* ─── RESPONSIVE ─── */
@media (max-width: 680px) {
  .page { grid-template-columns: 1fr; }
  aside { display: none; }
  main { padding: 1.5rem 1rem 3rem; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="faarai-intro.html">Faarai</a>
  <a class="nav-back" href="faarai-intro.html">← 紹介サイトへ</a>
</nav>

<div class="page">
  <!-- ─── SIDEBAR ─── -->
  <aside>
    <div class="sidebar-title">CATEGORIES</div>

    <a class="cat-link" data-cat="noun" onclick="filterCat('noun',this)">
      <span class="cat-dot" style="background:#7ec8e3"></span>
      基本名詞
      <span class="cat-count" id="cnt-noun"></span>
    </a>
    <a class="cat-link" data-cat="verb" onclick="filterCat('verb',this)">
      <span class="cat-dot" style="background:#b87ee3"></span>

      <span class="cat-count" id="cnt-verb"></span>
    </a>
    <a class="cat-link" data-cat="adj" onclick="filterCat('adj',this)">
      <span class="cat-dot" style="background:#e3b87e"></span>
      形容詞
      <span class="cat-count" id="cnt-adj"></span>
    </a>
    <a class="cat-link" data-cat="color" onclick="filterCat('color',this)">
      <span class="cat-dot" style="background:#e37e7e"></span>
      色
      <span class="cat-count" id="cnt-color"></span>
    </a>
    <a class="cat-link" data-cat="food" onclick="filterCat('food',this)">
      <span class="cat-dot" style="background:#e3c87e"></span>
      食べ物
      <span class="cat-count" id="cnt-food"></span>
    </a>
    <a class="cat-link" data-cat="creature" onclick="filterCat('creature',this)">
      <span class="cat-dot" style="background:#a8e37e"></span>
      生物
      <span class="cat-count" id="cnt-creature"></span>
    </a>
    <a class="cat-link" data-cat="it" onclick="filterCat('it',this)">
      <span class="cat-dot" style="background:#e37ea8"></span>
      IT用語
      <span class="cat-count" id="cnt-it"></span>
    </a>
    <a class="cat-link" data-cat="science" onclick="filterCat('science',this)">
      <span class="cat-dot" style="background:#7ea8e3"></span>
      科学
      <span class="cat-count" id="cnt-science"></span>
    </a>
    <a class="cat-link" data-cat="number" onclick="filterCat('number',this)">
      <span class="cat-dot" style="background:#7ee3c8"></span>
      数字
      <span class="cat-count" id="cnt-number"></span>
    </a>
  </aside>

  <!-- ─── MAIN ─── -->
  <main>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="単語・意味で検索…" oninput="doSearch()">
      <span class="search-count" id="search-count"></span>
    </div>

    <div class="filter-row" id="chip-row"></div>

    <div id="word-list"></div>
    <div class="empty" id="empty-state">
      <div class="empty-icon">Ø</div>
      <p>該当する単語が見つかりません</p>
    </div>
  </main>
</div>

<!-- ─── MODAL ─── -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-pos" id="m-pos"></div>
    <div class="modal-word" id="m-word"></div>
    <div class="modal-pron" id="m-pron"></div>
    <div class="modal-meaning" id="m-meaning"></div>
    <div class="modal-faarao-label">FAARAO SCRIPT</div>
    <div class="modal-faarao-render" id="m-faarao"></div>
  </div>
</div>

const CAT_ORDER = ["greeting","noun","verb","adj","color","food","creature","it","science","number"];
const CAT_LABEL = {
  greeting:"挨拶・表現", noun:"基本名詞", verb:"動詞", adj:"形容詞",
  color:"色", food:"食べ物", creature:"生物", it:"IT用語",
  science:"科学", number:"数字"
};

let engine = null;
let currentCat = "all";
let currentSearch = "";

// FaaraoEngine init
window.addEventListener('load', () => {
  if (typeof FaaraoEngine !== 'undefined') {
    engine = new FaaraoEngine();
  }
  buildChips();
  updateCounts();
  render();
});

function buildChips() {
  const row = document.getElementById('chip-row');
  ['すべて',...CAT_ORDER.map(c=>CAT_LABEL[c])].forEach((label, i) => {
    const cat = i===0 ? 'all' : CAT_ORDER[i-1];
    const chip = document.createElement('button');
    chip.className = 'chip' + (cat==='all'?' active':'');
    chip.textContent = label;
    chip.dataset.cat = cat;
    chip.onclick = () => {
      currentCat = cat;
      document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.cat===cat));
      document.querySelectorAll('.cat-link').forEach(c=>c.classList.toggle('active', c.dataset.cat===cat));
      render();
    };
    row.appendChild(chip);
  });
}

function updateCounts() {
  document.getElementById('cnt-all').textContent = WORDS.length;
  CAT_ORDER.forEach(cat => {
    const el = document.getElementById('cnt-'+cat);
    if (el) el.textContent = WORDS.filter(w=>w.cat===cat).length;
  });
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-link').forEach(c=>c.classList.toggle('active', c===el));
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.cat===cat));
  render();
}

function doSearch() {
  currentSearch = document.getElementById('search').value.trim().toLowerCase();
  render();
}

function render() {
  const list = document.getElementById('word-list');
  const empty = document.getElementById('empty-state');
  list.innerHTML = '';

  let filtered = WORDS.filter(w => {
    const matchCat = currentCat === 'all' || w.cat === currentCat;
    const matchSearch = !currentSearch ||
      w.w.toLowerCase().includes(currentSearch) ||
      w.meaning.includes(currentSearch) ||
      (w.pron && w.pron.toLowerCase().includes(currentSearch));
    return matchCat && matchSearch;
  });

  document.getElementById('search-count').textContent =
    currentSearch ? `${filtered.length}件` : '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const groups = {};
  filtered.forEach(w => {
    if (!groups[w.cat]) groups[w.cat] = [];
    groups[w.cat].push(w);
  });

  const orderedCats = currentCat === 'all'
    ? CAT_ORDER.filter(c => groups[c])
    : [currentCat];

  orderedCats.forEach(cat => {
    if (!groups[cat]) return;
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = `<span class="sec-title cat-${cat}">${CAT_LABEL[cat]}</span><span class="sec-count">${groups[cat].length}語</span>`;
    list.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'word-grid';
    groups[cat].forEach(w => {
      const card = document.createElement('div');
      card.className = `word-card cat-${cat}`;
      card.innerHTML = `
        <div class="wc-pos cat-${cat}">${w.pos}</div>
        <div class="wc-faarao" id="faairao">${w.w}</div>
        <div class="wc-meaning">${w.meaning}</div>
        ${w.pron ? `<div class="wc-pron">${w.pron}</div>` : ''}
      `;
      card.onclick = () => openModal(w);
      grid.appendChild(card);
    });
    list.appendChild(grid);
  });
}

function openModal(w) {
  document.getElementById('m-pos').textContent = w.pos;
  document.getElementById('m-pos').className = `modal-pos cat-${w.cat}`;
  document.getElementById('m-word').textContent = w.w;
  document.getElementById('m-pron').textContent = w.pron || '';
  document.getElementById('m-pron').style.display = w.pron ? '' : 'none';
  document.getElementById('m-meaning').textContent = w.meaning;

  const fr = document.getElementById('m-faarao');
  fr.innerHTML = '';
  if (engine) {
    const plain = w.w.replace(/[^A-Za-zÄÏÜËÖäïüëö\-]/g, ' ');
    fr.id = 'm-faarao-' + Date.now();
    engine.render(plain, fr.id);
    document.getElementById('m-faarao') || (fr.id = 'm-faarao');
  }

  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-bg') || e.currentTarget.classList.contains('modal-close')) {
    document.getElementById('modal-bg').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal({target: document.getElementById('modal-bg')});
});
</script>
